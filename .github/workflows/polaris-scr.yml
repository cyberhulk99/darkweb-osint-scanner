name: Polaris Security

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Declared explicitly rather than left to the repo's default GITHUB_TOKEN
# setting — matches exactly what the reusable workflows below actually
# need, no more. (CodeQL flags a caller workflow with no permissions block
# as actions/missing-workflow-permissions; this is that fix.)
permissions:
  contents: read
  id-token: write
  pull-requests: read
  security-events: write

jobs:
  scr:
    uses: cyberhulk99/polaris-workflows/.github/workflows/polaris-scr.yml@main
    with:
      app_key: darkweb-osint-scanner
      polaris_url: https://3fe2-106-51-85-191.ngrok-free.app
      rules_repo: cyberhulk99/polaris-workflows

  sca:
    uses: cyberhulk99/polaris-workflows/.github/workflows/polaris-sca.yml@main
    with:
      app_key: darkweb-osint-scanner
      polaris_url: https://3fe2-106-51-85-191.ngrok-free.app
      rules_repo: cyberhulk99/polaris-workflows

  # SBOM is "what's in the repo right now" — only meaningful on push, not a
  # PR diff, so the job itself is skipped entirely for pull_request events
  # rather than making the reusable workflow guess.
  sbom:
    if: github.event_name == 'push'
    uses: cyberhulk99/polaris-workflows/.github/workflows/polaris-sbom.yml@main
    with:
      app_key: darkweb-osint-scanner
      polaris_url: https://3fe2-106-51-85-191.ngrok-free.app

  cbom:
    uses: cyberhulk99/polaris-workflows/.github/workflows/polaris-cbom.yml@main
    with:
      app_key: darkweb-osint-scanner
      polaris_url: https://3fe2-106-51-85-191.ngrok-free.app
      rules_repo: cyberhulk99/polaris-workflows
